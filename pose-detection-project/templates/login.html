<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Detection App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .auth-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .main-app {
            display: none;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .video-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .video-section {
            flex: 1;
            min-width: 300px;
        }

        video, canvas {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
            align-items: center;
        }

        .status-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .status-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .status-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .status-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
        }

        .auth-toggle a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .mode-selector {
            margin: 20px 0;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .video-container {
                flex-direction: column;
            }
            
            .controls {
                justify-content: center;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BodySync AI – Intelligent motion and posture tracking</h1>
            <p>Yoga & Gym Exercise Tracker</p>
        </div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div id="loginForm">
                <h2>Login</h2>
                <div class="form-group">
                    <label for="loginUsername">Username:</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button class="btn" onclick="login()">Login</button>
                <div class="auth-toggle">
                    <a href="#" onclick="toggleAuthForm()">Don't have an account? Register</a>
                </div>
            </div>

            <div id="registerForm" style="display: none;">
                <h2>Register</h2>
                <div class="form-group">
                    <label for="registerUsername">Username:</label>
                    <input type="text" id="registerUsername" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password:</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button class="btn" onclick="register()">Register</button>
                <div class="auth-toggle">
                    <a href="#" onclick="toggleAuthForm()">Already have an account? Login</a>
                </div>
            </div>
        </div>

        <!-- Main Application -->
        <div id="mainApp" class="main-app">
            <div class="user-info">
                <div>
                    <span>Welcome, <strong id="username"></strong>!</span>
                </div>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>

            <!-- Mode Selection -->
            <div class="mode-selector">
                <h3>Select Mode:</h3>
                <div class="mode-buttons">
                    <button class="mode-btn active" onclick="setMode('yoga')" id="yogaBtn">Yoga Mode</button>
                    <button class="mode-btn" onclick="setMode('gym')" id="gymBtn">Gym Mode</button>
                </div>
            </div>

            <!-- Video Section -->
            <div class="video-container">
                <div class="video-section">
                    <h3>Camera Feed</h3>
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn" onclick="startCamera()" id="startBtn">Start Camera</button>
                <button class="btn btn-danger" onclick="stopCamera()" id="stopBtn" disabled>Stop Camera</button>
                <button class="btn btn-success" onclick="startDetection()" id="detectBtn" disabled>Start Detection</button>
                <button class="btn btn-secondary" onclick="stopDetection()" id="stopDetectBtn" disabled>Stop Detection</button>
                
                <select id="exerciseSelect" style="display: none;">
                    <option value="bicep_curls">Bicep Curls</option>
                    <option value="squats">Squats</option>
                    <option value="push_ups">Push Ups</option>
                    <option value="shoulder_press">Shoulder Press</option>
                    <option value="lateral_raises">Lateral Raises</option>
                    <option value="lunges">Lunges</option>
                    <option value="pull_ups">Pull Ups</option>
                    <option value="overhead_press">Overhead Press</option>
                </select>
                
                <button class="btn btn-danger" onclick="resetCounters()" id="resetBtn" style="display: none;">Reset Counters</button>
                <button class="btn btn-success" onclick="saveSession()">Save Session</button>
            </div>

            <!-- Status Panel -->
            <div class="status-panel">
                <h3>Status</h3>
                <div id="statusInfo">
                    <p>Mode: <span id="currentMode">yoga</span></p>
                    <p id="currentExercise" style="display: none;">Exercise: <span id="exerciseName">bicep_curls</span></p>
                </div>
                
                <div class="status-grid" id="statusGrid">
                    <!-- Status cards will be populated here -->
                </div>
            </div>

            <!-- Messages -->
            <div id="messages"></div>
        </div>
    </div>

    <script>
        // Global variables
        let currentUser = null;
        let authToken = null;
        let video = null;
        let canvas = null;
        let ctx = null;
        let isDetecting = false;
        let detectionInterval = null;
        let currentMode = 'yoga';

        // API base URL - change this to your backend URL
        const API_BASE = 'http://localhost:5000/api';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            // Check for stored token
            const storedToken = localStorage.getItem('authToken');
            const storedUser = localStorage.getItem('user');
            
            if (storedToken && storedUser) {
                authToken = storedToken;
                currentUser = JSON.parse(storedUser);
                showMainApp();
            }

            // Exercise selector change
            document.getElementById('exerciseSelect').addEventListener('change', function() {
                setExercise(this.value);
            });
        });

        // Authentication functions
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    showMainApp();
                    showMessage('Login successful!', 'success');
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    showMainApp();
                    showMessage('Registration successful!', 'success');
                } else {
                    showMessage(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            stopCamera();
            showAuthSection();
            showMessage('Logged out successfully', 'success');
        }

        function toggleAuthForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        function showMainApp() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('username').textContent = currentUser.username;
            updateUI();
        }

        function showAuthSection() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }

        // Camera functions
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };

                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('detectBtn').disabled = false;
                
                showMessage('Camera started successfully', 'success');
            } catch (error) {
                showMessage('Error accessing camera: ' + error.message, 'error');
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                const tracks = video.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
            }
            
            stopDetection();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('detectBtn').disabled = true;
        }

        // Detection functions
        async function startDetection() {
            if (!authToken) {
                showMessage('Please login first', 'error');
                return;
            }

            isDetecting = true;
            document.getElementById('detectBtn').disabled = true;
            document.getElementById('stopDetectBtn').disabled = false;
            
            detectionInterval = setInterval(processFrame, 1000); // Process every second
            showMessage('Detection started', 'success');
        }

        function stopDetection() {
            isDetecting = false;
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            
            document.getElementById('detectBtn').disabled = false;
            document.getElementById('stopDetectBtn').disabled = true;
            showMessage('Detection stopped', 'success');
        }

        async function processFrame() {
            if (!isDetecting || !video.videoWidth) return;

            // Draw video frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert canvas to base64
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch(`${API_BASE}/process_frame`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();
                
                if (response.ok) {
                    updateStatus(data);
                } else {
                    console.error('Detection error:', data.error);
                }
            } catch (error) {
                console.error('Network error:', error);
            }
        }

        // Mode and exercise functions
        async function setMode(mode) {
            try {
                const response = await fetch(`${API_BASE}/set_mode`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ mode })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentMode = mode;
                    updateUI();
                    showMessage(`Switched to ${mode} mode`, 'success');
                }
            } catch (error) {
                showMessage('Error setting mode', 'error');
            }
        }

        async function setExercise(exercise) {
            try {
                const response = await fetch(`${API_BASE}/set_exercise`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ exercise })
                });

                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('exerciseName').textContent = exercise;
                    showMessage(`Exercise set to ${exercise}`, 'success');
                }
            } catch (error) {
                showMessage('Error setting exercise', 'error');
            }
        }

        async function resetCounters() {
            try {
                const response = await fetch(`${API_BASE}/reset_counter`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ exercise: 'all' })
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage('All counters reset', 'success');
                }
            } catch (error) {
                showMessage('Error resetting counters', 'error');
            }
        }

        async function saveSession() {
            try {
                const response = await fetch(`${API_BASE}/save_session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    showMessage('Session saved successfully', 'success');
                }
            } catch (error) {
                showMessage('Error saving session', 'error');
            }
        }

        // UI functions
        function updateUI() {
            const isGymMode = currentMode === 'gym';
            
            document.getElementById('currentMode').textContent = currentMode;
            document.getElementById('exerciseSelect').style.display = isGymMode ? 'inline-block' : 'none';
            document.getElementById('resetBtn').style.display = isGymMode ? 'inline-block' : 'none';
            document.getElementById('currentExercise').style.display = isGymMode ? 'block' : 'none';
            
            // Update mode buttons
            document.getElementById('yogaBtn').classList.toggle('active', currentMode === 'yoga');
            document.getElementById('gymBtn').classList.toggle('active', currentMode === 'gym');
        }

        function updateStatus(data) {
            const statusGrid = document.getElementById('statusGrid');
            
            if (data.mode === 'yoga') {
                statusGrid.innerHTML = `
                    <div class="status-card">
                        <h3>Detected Pose</h3>
                        <div class="value">${data.pose_class || 'None'}</div>
                    </div>
                    <div class="status-card">
                        <h3>Confidence</h3>
                        <div class="value">${data.confidence ? (data.confidence * 100).toFixed(1) + '%' : '0%'}</div>
                    </div>
                    <div class="status-card">
                        <h3>Landmarks</h3>
                        <div class="value">${data.landmarks ? '✓' : '✗'}</div>
                    </div>
                `;
            } else {
                statusGrid.innerHTML = `
                    <div class="status-card">
                        <h3>Current Exercise</h3>
                        <div class="value">${data.exercise?.replace('_', ' ') || 'None'}</div>
                    </div>
                    <div class="status-card">
                        <h3>Count</h3>
                        <div class="value">${data.count || 0}</div>
                    </div>
                    <div class="status-card">
                        <h3>Stage</h3>
                        <div class="value">${data.stage || 'None'}</div>
                    </div>
                    <div class="status-card">
                        <h3>Total Reps</h3>
                        <div class="value">${data.total_reps || 0}</div>
                    </div>
                    <div class="status-card">
                        <h3>Angle</h3>
                        <div class="value">${data.angle ? data.angle.toFixed(1) + '°' : 'N/A'}</div>
                    </div>
                    <div class="status-card">
                        <h3>Landmarks</h3>
                        <div class="value">${data.landmarks ? '✓' : '✗'}</div>
                    </div>
                `;
            }
        }

        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            messagesDiv.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
